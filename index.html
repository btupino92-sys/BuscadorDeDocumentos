<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador y Repositorio de Matriz Documental</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS para leer Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Encabezado -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Repositorio y Buscador - Matriz Documental</h1>
                <p class="text-sm text-gray-500">Los archivos cargados se guardan automáticamente en el repositorio institucional.</p>
            </div>
            
            <!-- Botón de Carga -->
            <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                Cargar y Guardar Excel
                <input type="file" id="inputFiles" multiple accept=".xlsx, .xls, .csv" class="hidden" />
            </label>
        </div>

        <!-- Buscador y Contador -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="w-full sm:w-96 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="buscador" placeholder="Buscar por Razón Social, Caja, Serie..." 
                    class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div class="text-sm text-gray-500 font-medium" id="contadorResultados">
                Cargando registros del repositorio...
            </div>
        </div>

        <!-- Tabla de Resultados con Encabezados Fijos -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse" id="tablaMatriz">
                    <thead class="bg-gray-100 text-gray-700 text-xs uppercase font-semibold sticky top-0 z-10" id="tablaEncabezado">
                        <!-- Se pintan los 16 campos exactos por defecto -->
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm text-gray-600" id="tablaCuerpo">
                        <tr>
                            <td colspan="17" class="text-center py-12 text-gray-400">
                                Sincronizando datos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Tus 16 columnas fijas institucionales + Columna de Trazabilidad (Archivo Origen)
        const encabezadosFijos = [
            "N° CAJA (CÓDIGO)", "Nº DE PAQUETE", "N° DE REGISTRO ARCHIVÍSTICO", "TOMO", 
            "RANGO INICIAL", "RANGO FINAL", "N° FOLIOS", "SERIE DOCUMENTAL", 
            "N° DE DOCUMENTO PRINCIPAL", "RAZON SOCIAL / NOMBRES Y APELLIDOS", 
            "DESCRIPCIÓN DOCUMENTAL", "FECHA EXTREMA", "OBSERVACIONES", "X1", "X2", "X3", "Archivo Origen"
        ];

        let datosGlobales = [];

        // Al cargar la página, inicializar la tabla con los encabezados fijos
        window.addEventListener('DOMContentLoaded', () => {
            inicializarEncabezados();
            cargarDatosDesdeRepositorio();
        });

        function inicializarEncabezados() {
            const thead = document.getElementById('tablaEncabezado');
            thead.innerHTML = '';
            let trHead = document.createElement('tr');
            encabezadosFijos.forEach(col => {
                let th = document.createElement('th');
                th.className = "px-3 py-3 border-b border-gray-200 whitespace-nowrap text-xs";
                th.innerText = col;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);
        }

        // Simula la lectura del repositorio local / JSON almacenado en GitHub
        async function cargarDatosDesdeRepositorio() {
            try {
                // Buscamos un archivo consolidado.json en el mismo repositorio
                let response = await fetch('consolidado.json');
                if (response.ok) {
                    datosGlobales = await response.json();
                    renderizarTabla(datosGlobales);
                } else {
                    renderizarTabla([]);
                }
            } catch (e) {
                renderizarTabla([]);
            }
        }

        // Procesar nuevos archivos Excel cargados
        document.getElementById('inputFiles').addEventListener('change', async function(e) {
            const archivos = e.target.files;
            if (archivos.length === 0) return;

            let nuevosRegistros = [];

            for (let i = 0; i < archivos.length; i++) {
                let archivo = archivos[i];
                let registrosArchivo = await leerArchivoExcel(archivo);
                nuevosRegistros = [...nuevosRegistros, ...registrosArchivo];
            }

            // Unir con los datos existentes
            datosGlobales = [...datosGlobales, ...nuevosRegistros];
            renderizarTabla(datosGlobales);

            // Instrucción para exportar el JSON actualizado que guardará el repositorio
            descargarJsonActualizado(datosGlobales);
            alert("¡Archivos procesados! Se ha descargado un archivo 'consolidado.json'. Súbelo a la raíz de tu repositorio en GitHub para actualizar el repositorio permanente.");
        });

        function leerArchivoExcel(archivo) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    let resultadosParciales = [];
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        workbook.SheetNames.forEach(nombrePestaña => {
                            const worksheet = workbook.Sheets[nombrePestaña];
                            const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                            // Omitimos la fila 0 (encabezado del Excel) y leemos desde i = 1
                            for (let i = 1; i < json.length; i++) {
                                let fila = json[i];
                                if (fila && fila.some(celda => celda !== "")) {
                                    // Asegurar exactamente las 16 columnas + archivo origen
                                    let filaAjustada = [];
                                    for (let c = 0; c < 16; c++) {
                                        filaAjustada.push(fila[c] !== undefined ? fila[c] : "");
                                    }
                                    filaAjustada.push(archivo.name); // Archivo origen
                                    resultadosParciales.push(filaAjustada);
                                }
                            }
                        });
                    } catch (err) {
                        console.error("Error al leer el archivo", err);
                    }
                    resolve(resultadosParciales);
                };
                reader.readAsArrayBuffer(archivo);
            });
        }

        function renderizarTabla(datos) {
            const tbody = document.getElementById('tablaCuerpo');
            const contador = document.getElementById('contadorResultados');
            tbody.innerHTML = '';

            if (datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="17" class="text-center py-12 text-gray-400">No hay registros en el repositorio. Sube un archivo Excel para comenzar.</td></tr>`;
                contador.innerText = "Mostrando 0 registros";
                return;
            }

            let fragmento = document.createDocumentFragment();
            datos.forEach(fila => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition border-b border-gray-100";
                
                for (let j = 0; j < encabezadosFijos.length; j++) {
                    let td = document.createElement('td');
                    td.className = "px-3 py-2 whitespace-nowrap text-xs text-gray-700";
                    td.innerText = fila[j] !== undefined ? fila[j] : "";
                    tr.appendChild(td);
                }
                fragmento.appendChild(tr);
            });

            tbody.appendChild(fragmento);
            contador.innerText = `Mostrando ${datos.length} registros en total`;
        }

        // Genera el archivo JSON consolidado para actualizar el repositorio en GitHub
        function descargarJsonActualizado(datos) {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datos, null, 2));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "consolidado.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Buscador instantáneo en tiempo real
        document.getElementById('buscador').addEventListener('input', function(e) {
            const textoBusqueda = e.target.value.toLowerCase();
            
            const datosFiltrados = datosGlobales.filter(fila => {
                return fila.some(celda => String(celda).toLowerCase().includes(textoBusqueda));
            });

            renderizarTabla(datosFiltrados);
        });
    </script>
</body>
</html>
